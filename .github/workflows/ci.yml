name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19.5"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  prose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No em or en dashes in public copy
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.md' --include='*.ex' --include='*.heex' lib README.md; then
            echo "Found em or en dashes"; exit 1
          fi
